<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DANNY DANSON</title>

<!-- Шрифт Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- ШАПКА -->
<header class="header">
  <div class="logo">ДЭННИ ДЭНСОН</div>

  <!-- ИКОНКА КОРЗИНЫ.
       Сейчас вставлена SVG-корзинка как заглушка.
       Чтобы поставить свою — просто замени содержимое <svg>...</svg>
       на свой <svg>, либо на <img src="icon.svg" class="cart-icon" alt="">
  -->
  <button class="cart-btn" id="cart-btn" aria-label="Корзина">
    <svg class="cart-icon" viewBox="0 0 24 24" width="24" height="24"
         fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.8h8.7a2 2 0 0 0 2-1.6L21 8H6"/>
      <circle cx="10" cy="20" r="1.4"/>
      <circle cx="18" cy="20" r="1.4"/>
    </svg>
    <span class="cart-count" id="cart-count" hidden>0</span>
  </button>
</header>

  <!-- ЭКРАН 1: КАТАЛОГ -->
  <main id="catalog-view" class="view active">
    <div class="grid" id="catalog-grid"></div>
  </main>

  <!-- ЭКРАН 2: КАРТОЧКА ТОВАРА -->
  <main id="product-view" class="view">
    <button class="back-btn" data-back="catalog">← Назад</button>
    <div id="product-content"></div>
  </main>

  <!-- ЭКРАН 3: КОРЗИНА -->
  <main id="cart-view" class="view">
    <button class="back-btn" data-back="catalog">← Назад</button>
    <h2 class="view-title">Корзина</h2>
    <div id="cart-items"></div>
    <div class="cart-summary" id="cart-summary"></div>
  </main>

  <!-- ЭКРАН 4: ОФОРМЛЕНИЕ ЗАКАЗА -->
  <main id="checkout-view" class="view">
    <button class="back-btn" data-back="cart">← Назад</button>
    <h2 class="view-title">Оформление заказа</h2>
<form id="checkout-form" novalidate>
  <label>ФИО
    <input type="text" id="f-fio" autocomplete="name" placeholder="Иванов Иван">
  </label>

  <label>Ник в Telegram
    <input type="text" id="f-tgnick" autocomplete="off" placeholder="@username">
    <span class="field-hint" id="hint-tgnick" hidden>Проверь, всё ли верно. Если ник скрыт — впиши свой вручную</span>
  </label>

  <label>Телефон
    <input type="tel" id="f-phone" inputmode="tel" autocomplete="tel" placeholder="+7 (___) ___-__-__">
  </label>

  <label>Город
    <input type="text" id="f-city" autocomplete="address-level2" placeholder="Москва">
  </label>

  <label>Адрес ПВЗ / пункта выдачи
    <input type="text" id="f-pvz" autocomplete="street-address" placeholder="СДЭК, ул. Ленина, 5">
  </label>

  <label>Комментарий (необязательно)
    <textarea id="f-comment" rows="3"></textarea>
  </label>

  <button type="submit" class="submit-btn">ПОДТВЕРДИТЬ ЗАКАЗ</button>
</form>
  </main>

  <!-- ЭКРАН 5: ЗАКАЗ ОФОРМЛЕН -->
  <main id="done-view" class="view">
    <div class="done-box">
      <div class="done-check">✓</div>
      <p>Заказ оформлен. Мы свяжемся с тобой в ближайшее время.</p>
      <button class="submit-btn" data-back="catalog">В каталог</button>
    </div>
  </main>

  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
